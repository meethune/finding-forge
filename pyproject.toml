[project]
name = "finding-forge"
version = "0.1.0"
description = "Tool-agnostic pen test evidence capture and AI-assisted finding drafting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "anthropic>=0.40",
]

[project.scripts]
pentest-capture = "finding_forge.cli:capture"
pentest-draft = "finding_forge.cli:draft"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finding_forge"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["finding_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
